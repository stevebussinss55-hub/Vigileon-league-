name: 2 - Build Android app (.aab)
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@latest
      - name: Restore signing key
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > vigileon-release.keystore
      - name: Build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          yes | bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json
          yes | bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: vigileon-android
          path: |
            app-release-bundle.aab
            app-release-signed.apk

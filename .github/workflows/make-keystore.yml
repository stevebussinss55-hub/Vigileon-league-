# Run ONCE. Creates your Android signing key and gives it to you as a downloadable file.
name: 1 - Make signing key (run once)
on: workflow_dispatch
jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore vigileon-release.keystore -alias vigileon \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Vigileon Codebase, O=Vigileon Codebase, C=GH"
          base64 -w0 vigileon-release.keystore > KEYSTORE_BASE64.txt
          echo "$PASS" > KEYSTORE_PASSWORD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: signing-key-KEEP-SAFE
          path: |
            vigileon-release.keystore
            KEYSTORE_BASE64.txt
            KEYSTORE_PASSWORD.txt
          retention-days: 3
